services:
  bulky:
    image: ghcr.io/addun/bulky:v0.2.4
    container_name: bulky
    restart: unless-stopped
    user: 1000:1000
    env_file:
      - .env
    environment:
      - TZ=Europe/Warsaw
    networks:
      - reverse-proxy
    volumes:
      - ./bulkly:/data

networks:
  reverse-proxy:
    name: reverse-proxy
