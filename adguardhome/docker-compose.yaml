services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:v0.107.74
    labels:
      # Stable vX.Y.Z only; skip beta tags like v0.108.0-b.88.
      - wud.tag.include=^v\d+\.\d+\.\d+$$
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./data:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    ports:
      - 53:53/tcp
      - 53:53/udp
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    name: reverse-proxy
