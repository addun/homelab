services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:v0.107.74
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./data:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    ports:
      - 53:53/tcp
      - 53:53/udp
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    name: reverse-proxy
