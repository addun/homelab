services:
  homeassistant:
    container_name: homeassistant
    image: "homeassistant/home-assistant:2026.3.3"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    user: 1000:1000
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - assistant

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt:2.9.1
    restart: unless-stopped
    group_add:
      - dialout
    user: 1000:1000
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./zigbee2mqtt-data:/app/data
      - /run/udev:/run/udev:ro
    networks:
      - assistant
      - reverse-proxy
    devices:
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_e0ae5c5183f3ef11b798bb1b6d9880ab-if00-port0:/dev/ttyUSB0

  esphome:
    image: esphome/esphome:2026.3.1
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ./esphome-config:/config
      - /etc/localtime:/etc/localtime:ro

networks:
  reverse-proxy:
    name: reverse-proxy
  assistant:
    driver: bridge
