services:
  homeassistant:
    container_name: homeassistant
    image: "homeassistant/home-assistant:2026.6.2"
    # ports:
    # - "8123:8123"
    labels:
      # Skip any tag containing "dev" (e.g. 2026.7.0.dev202606090319).
      - wud.tag.exclude=dev
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    labels:
      # Only track the -alpine variant; ignore plain tags.
      - wud.tag.include=^\d+\.\d+\.\d+-alpine$$
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    user: 1000:1000
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - assistant

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt:2.12.0
    restart: unless-stopped
    group_add:
      - dialout
    user: 1000:1000
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./zigbee2mqtt-data:/app/data
      - /run/udev:/run/udev:ro
    networks:
      - assistant
      - reverse-proxy
    devices:
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_e0ae5c5183f3ef11b798bb1b6d9880ab-if00-port0:/dev/ttyUSB0

  esphome:
    image: esphome/esphome:2026.5.3
    labels:
      # Stable X.Y.Z only; skip dev builds and prereleases like 2026.6.0b1.
      - wud.tag.include=^\d+\.\d+\.\d+$$
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ./esphome-config:/config
      - /etc/localtime:/etc/localtime:ro

  ebusd:
    image: john30/ebusd:v26.1
    container_name: ebusd
    restart: unless-stopped
    networks:
      - assistant
    ports:
      - 8888:8888
    environment:
      # - EBUSD_ENABLEHEX=
      - EBUSD_DEVICE=ens:192.168.68.162:9999
      - EBUSD_MQTTHOST=mosquitto
      - EBUSD_MQTTPORT=1883
      - EBUSD_MQTTJSON=
      - EBUSD_MQTTINT=/etc/ebusd/mqtt-hassio.cfg

networks:
  reverse-proxy:
    name: reverse-proxy
  assistant:
    driver: bridge
