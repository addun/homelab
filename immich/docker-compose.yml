services:
  immich-server:
    container_name: immich
    image: ghcr.io/immich-app/immich-server:v3.2.0
    volumes:
      - ./library:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 2283:2283
    env_file:
      - .env
    depends_on:
      - redis
      - database
    restart: unless-stopped
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    healthcheck:
      disable: false
    networks:
      - reverse-proxy
      - immich

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.0-openvino
    labels:
      # Stay on the OpenVINO variant; ignore plain vX.Y.Z tags.
      - wud.tag.include=^v\d+\.\d+\.\d+-openvino$$
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - immich
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    dns:
      - 127.0.0.11
      - 8.8.8.8

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    networks:
      - immich

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    networks:
      - immich

  immich-deduper:
    container_name: immich-deduper
    image: razgrizhsu/immich-deduper:0.3.3
    env_file:
      - .env
    environment:
      PSQL_HOST: database
      PSQL_PORT: 5432
      PSQL_DB: ${DB_DATABASE_NAME}
      PSQL_USER: ${DB_USERNAME}
      PSQL_PASS: ${DB_PASSWORD}
    volumes:
      - ./deduper/data:/app/data
      - ./deduper/cache:/root/.cache/torch/
      - ./library:/immich:ro
    depends_on:
      - immich-deduper-qdrant
      - database
    restart: unless-stopped
    networks:
      - reverse-proxy
      - immich

  immich-deduper-qdrant:
    container_name: immich-deduper-qdrant
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - ./deduper/qdrant:/qdrant/storage
    networks:
      - immich

networks:
  reverse-proxy:
    name: reverse-proxy
  immich:
    name: immich
    driver: bridge
