services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:10.11.8
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "992"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/storage/media:/media
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:release-6.0.4.10291
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./radarr/config:/config
      - /mnt/storage/media:/media
      - /mnt/storage/media/downloads:/downloads
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:release-4.0.17.2952
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./sonarr/config:/config
      - /mnt/storage/media:/media
      - /mnt/storage/media/downloads:/downloads
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:release-2.3.0.5236
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    container_name: flaresolverr
    environment:
      - TZ=Etc/UTC
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.2.0
    container_name: seerr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./seerr/config:/app/config
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  huntarr:
    container_name: huntarr
    image: ghcr.io/plexguide/huntarr:8.2.10
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./huntarr/config:/config
    networks:
      - arr
      - reverse-proxy

  transmission:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: arr-wireguard-client
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  transmission-internal:
    image: lscr.io/linuxserver/transmission:4.1.1
    container_name: transmission
    network_mode: "service:transmission"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - ./transmission/config:/config
      - /mnt/storage/media/downloads:/downloads
    restart: unless-stopped

networks:
  arr:
    driver: bridge
  reverse-proxy:
    name: reverse-proxy
