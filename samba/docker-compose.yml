services:
  samba:
    image: dockurr/samba
    container_name: samba
    restart: always

    ports:
      - "137:137/udp"
      - "138:138/udp"
      - "139:139/tcp"
      - "445:445/tcp"

    volumes:
      - ./storage/PublicShare:/storage
      - ./users.conf:/etc/samba/users.conf

    environment:
      - SHARE=MyShare
