services:
  caddy:
    image: caddy:2.10.2
    container_name: caddy
    ports:
      - "80:80"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./conf:/etc/caddy
    networks:
      reverse-proxy:
        ipv4_address: 172.18.0.15
      monitoring:
        ipv4_address: 172.23.0.3

networks:
  reverse-proxy:
    external: true
  monitoring:
    external: true
