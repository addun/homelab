services:
  jellyfin:
    image: jellyfin/jellyfin:2026032305
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "992"
    volumes:
      - ./jellyfin_config:/config
      - ./jellyfin_cache:/cache
      - ./media:/media
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:release-6.0.4.10291
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./radarr_config:/config
      - ./media:/media
      - ./media/downloads:/downloads
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:release-4.0.17.2952
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./sonarr_config:/config
      - ./media:/media
      - ./media/downloads:/downloads
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:release-2.3.0.5236
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - ./prowlarr_config:/config
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.1
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - ./transmission_config:/config
      - ./media/downloads:/downloads
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    container_name: flaresolverr
    environment:
      - TZ=Etc/UTC
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.1.0
    container_name: seerr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./seerr_config:/app/config
    restart: unless-stopped
    networks:
      - arr
      - reverse-proxy

  huntarr:
    container_name: huntarr
    image: ghcr.io/plexguide/huntarr:8.2.10
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ./huntarr_config:/config
    networks:
      - arr
      - reverse-proxy

networks:
  arr:
    driver: bridge
  reverse-proxy:
    name: reverse-proxy
