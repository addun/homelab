services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "853:853"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./wg-edge/config:/config
    networks:
      - reverse-proxy
      - monitoring
      - nextcloud-aio
      - crowdsec
    restart: unless-stopped

  caddy:
    build:
      context: .
      target: caddy
    container_name: caddy
    user: 1000:1000
    network_mode: "service:wireguard"
    restart: unless-stopped
    volumes:
      - ./caddy/conf:/etc/caddy
      - ./caddy/logs:/var/log/caddy
      - ./caddy/data:/data
    depends_on:
      - wireguard
      - crowdsec
    env_file:
      - .env
    security_opt:
      - no-new-privileges=true

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    container_name: crowdsec
    environment:
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/base-http-scenarios crowdsecurity/http-cve
      - BOUNCER_KEY_CADDY=${CROWDSEC_API_KEY}
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./caddy/logs:/var/log/caddy:ro
    networks:
      - crowdsec
      - monitoring
      - email
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true

networks:
  reverse-proxy:
    name: reverse-proxy
  monitoring:
    name: monitoring
  nextcloud-aio:
    name: nextcloud-aio
  crowdsec:
    driver: bridge
  email:
    name: email
