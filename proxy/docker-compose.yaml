services:
  caddy:
    image: caddy:2.10.2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./conf:/etc/caddy
    networks:
      - reverse-proxy
      - monitoring
      - nextcloud-aio

networks:
  reverse-proxy:
    name: reverse-proxy
  monitoring:
    name: monitoring
  nextcloud-aio:
    name: nextcloud-aio
