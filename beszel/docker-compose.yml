services:
  beszel:
    image: henrygd/beszel:0.18.7
    container_name: beszel
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    restart: unless-stopped
    networks:
      - reverse-proxy
      - beszel

  beszel-agent:
    image: henrygd/beszel-agent-intel:0.18.7
    cap_add:
      - CAP_PERFMON
    container_name: beszel-agent
    restart: unless-stopped
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

      - /mnt/storage/.beszel:/extra-filesystems/storage:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      LISTEN: 45876
      KEY: "${KEY}"
      TOKEN: "${TOKEN}"
      HUB_URL: http://beszel:8090
    networks:
      - beszel

networks:
  beszel:
    driver: bridge
  reverse-proxy:
    name: reverse-proxy
