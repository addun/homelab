services:
  backup:
    build:
      context: ./app
    container_name: backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Warsaw
      - RESTIC_REPOSITORY=/repo
      - RESTIC_CACHE_DIR=/cache
      - RUN_AT=05:00
      - MAIL_HOST=mail-proxy
      - MAIL_PORT=25
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_TO=${MAIL_TO}
    volumes:
      - /home/greenserver/apps:/apps:ro
      - /mnt/storage/backups/restic:/repo
      - /mnt/storage/backups/restore-test:/restore
      - ./cache:/cache
    networks:
      - email

networks:
  email:
    name: email
